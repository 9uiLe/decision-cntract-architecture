name: DcaApp
options:
  bundleIdPrefix: example.reservation
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  DcaApp:
    type: application
    platform: iOS
    sources:
      - DcaApp
    info:
      path: DcaApp/Info.plist
      properties:
        CFBundleDisplayName: ワークショップ予約
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.reservation.dca
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework DcaShared"
    preBuildScripts:
      - name: 共通 framework をビルドする
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
