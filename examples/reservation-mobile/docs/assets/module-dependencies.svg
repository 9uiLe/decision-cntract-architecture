<svg xmlns="http://www.w3.org/2000/svg" width="800" height="659" viewBox="0 0 800 659" role="img" aria-labelledby="title desc">
  <title id="title">モバイルサンプルのモジュール依存</title>
  <desc id="desc">Gradle の project 依存を、参照元から依存先への矢印で示す。起動口の :app は :shared に依存し、iOS は Xcode が共通 framework をリンクする。:shared は :ui、:adapter-simulator、3つの Core と :kernel に依存する。:ui と :adapter-simulator も3つの Core と :kernel に依存する。Core 層では来場受付 Core が予約 Core に、予約 Core が参加資格 Core に依存し、3つの Core は :kernel に依存する。来場受付 Core から参加資格 Core への直接の依存は基準仕様では禁止で、課題 I で追加する。予約 Core の api 経由で参加資格 Core の型が推移的に見えても、直接の依存宣言と import は許可しない。外部ライブラリ、検証用モジュール、各モジュールから Core と :kernel への個別の依存は省略している。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 5 0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="659" fill="#f8fafc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans CJK JP', Meiryo, sans-serif" fill="#142638">
    <text x="30" y="34" font-size="18" font-weight="700">モバイルサンプルのモジュール依存</text>
    <text x="30" y="56" font-size="12">Gradle の project 依存を、参照元 → 依存先の矢印で示す</text>

    <rect x="30" y="360" width="740" height="190" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="46" y="382" font-size="13" font-weight="700" fill="#1d4ed8">3 つの Core（判断と Port を所有）と :kernel</text>

    <g fill="none" stroke-width="2">
      <g stroke="#334155" marker-end="url(#arrow)">
        <path d="M230 124V142H370V160"/>
        <path d="M300 186H180V270"/>
        <path d="M500 186H620V270"/>
        <path d="M400 212V360"/>
        <path d="M180 322V360"/>
        <path d="M620 322V360"/>
        <path d="M250 438H305"/>
        <path d="M495 438H550"/>
        <path d="M155 464V478H350V492"/>
        <path d="M400 464V492"/>
        <path d="M645 464V478H450V492"/>
      </g>
      <path d="M570 124V142H430V160" stroke="#64748b" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
      <path d="M155 412V396H645V412" stroke="#64748b" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
    </g>
    <rect x="250" y="385" width="300" height="22" fill="#ffffff"/>
    <text x="400" y="401" font-size="12" text-anchor="middle">✕ 直接の依存は基準仕様で禁止（課題 I で追加）</text>

    <g stroke="#0f766e" stroke-width="1.5" fill="#f0fdfa">
      <rect x="130" y="80" width="200" height="44" rx="22"/>
      <rect x="470" y="80" width="200" height="44" rx="22" stroke-dasharray="7 4"/>
      <rect x="300" y="160" width="200" height="52" rx="12"/>
      <rect x="60" y="270" width="240" height="52" rx="12"/>
      <rect x="500" y="270" width="240" height="52" rx="12"/>
    </g>
    <g stroke="#1d4ed8" stroke-width="2" fill="#eff6ff">
      <rect x="60" y="412" width="190" height="52" rx="4"/>
      <rect x="305" y="412" width="190" height="52" rx="4"/>
      <rect x="550" y="412" width="190" height="52" rx="4"/>
      <rect x="300" y="492" width="200" height="44" rx="4"/>
    </g>

    <g text-anchor="middle">
      <g font-size="14" font-weight="700">
        <text x="230" y="99">:app</text>
        <text x="570" y="99">iosApp（Xcode）</text>
        <text x="400" y="182">:shared</text>
        <text x="180" y="292">:ui</text>
        <text x="620" y="292">:adapter-simulator</text>
        <text x="155" y="434">:checkin-core</text>
        <text x="400" y="434">:reservation-core</text>
        <text x="645" y="434">:eligibility-core</text>
        <text x="400" y="511">:kernel</text>
      </g>
      <g font-size="12">
        <text x="230" y="116">Android の起動口</text>
        <text x="570" y="116">iOS の起動口</text>
        <text x="400" y="200">Core・Adapter・画面を接続</text>
        <text x="180" y="310">画面状態への変換と Compose 画面</text>
        <text x="620" y="310">各 Core の Port の実装</text>
        <text x="155" y="453">来場受付の判断</text>
        <text x="400" y="453">予約の判断</text>
        <text x="645" y="453">参加資格の判断</text>
        <text x="400" y="528">識別子・時計・契約の注釈</text>
      </g>
    </g>
    <g font-size="12">
      <text x="408" y="290">3 Core と</text>
      <text x="408" y="306">:kernel へも</text>
      <text x="408" y="322">直接依存</text>
      <text x="190" y="338">3 Core と :kernel へ</text>
      <text x="190" y="353">直接依存</text>
      <text x="630" y="338">3 Core と :kernel へ</text>
      <text x="630" y="353">直接依存</text>
    </g>

    <g fill="none" stroke-width="2">
      <path d="M40 584H80" stroke="#334155" marker-end="url(#arrow)"/>
      <path d="M40 606H80" stroke="#64748b" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
      <path d="M40 628H80" stroke="#64748b" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
    </g>
    <g font-size="12">
      <text x="92" y="588">Gradle の project 依存（参照元 → 依存先）</text>
      <text x="92" y="610">Gradle の外の接続: Xcode が :shared の共通 framework をリンクする</text>
      <text x="92" y="632">基準仕様では禁止している直接の依存（ModuleBoundaryTest が検査）</text>
    </g>

  </g>
</svg>
