<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="title description">
  <title id="title">仕様変更の実験手順</title>
  <desc id="description">共通の基準仕様を一時ディレクトリにコピーし、課題ごとに差分を適用する。診断とテスト結果を実験ごとに照合する。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#47647b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; fill: #142638; }
    .title { font-size: 31px; font-weight: 700; }
    .label { font-size: 23px; font-weight: 700; }
    .body { font-size: 19px; }
    .small { font-size: 17px; fill: #475569; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 19px; }
    .blue { fill: #1d4ed8; }
    .teal { fill: #0f766e; }
  </style>
  <rect width="800" height="230" rx="20" fill="#f8fafc"/>
  <text x="40" y="57" class="title" text-anchor="start">仕様変更の実験手順</text>
  <rect x="40" y="93" width="220" height="108" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="55" y="126" class="body" text-anchor="start">基準仕様</text>
  <text x="55" y="158" class="small" text-anchor="start">作業ツリーをコピー</text>
  <text x="55" y="183" class="small" text-anchor="start">課題ごとに別の一時領域</text>
  <path d="M260 147H285" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="93" width="220" height="108" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="305" y="126" class="body" text-anchor="start">変更を適用</text>
  <text x="305" y="158" class="small" text-anchor="start">差分を段階ごとに適用</text>
  <text x="305" y="183" class="small" text-anchor="start">想定した診断を照合</text>
  <path d="M510 147H535" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="93" width="220" height="108" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="555" y="126" class="body" text-anchor="start">対応後を検証</text>
  <text x="555" y="158" class="small" text-anchor="start">振る舞いをテスト</text>
  <text x="555" y="183" class="small" text-anchor="start">結果と変更範囲を記録</text>
</svg>
