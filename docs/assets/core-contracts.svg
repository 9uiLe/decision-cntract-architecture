<svg xmlns="http://www.w3.org/2000/svg" width="860" height="465" viewBox="0 0 860 465" role="img" aria-labelledby="title desc">
  <title id="title">DCA 検証アプリの依存関係</title>
  <desc id="desc">参照元から依存先への矢印。来場受付 Core は予約 Core を、予約 Core は参加資格 Core を参照する。プレゼンテーションは3つの Core を参照し、シミュレーターは各 Core の Port を実装する。組み立てはプレゼンテーション、各 Core とシミュレーターを接続する。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4.5 0 9Z" fill="#486581"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="463" rx="14" fill="#f5f8fb" stroke="#c3d3e0"/>
  <g fill="none" stroke="#486581" stroke-width="2" marker-end="url(#arrow)">
    <path d="M430 73V108"/>
    <path d="M290 49H16V384H290"/>
    <path d="M340 156V181H145V223"/>
    <path d="M430 156V223"/>
    <path d="M520 156V181H715V223"/>
    <path d="M290 64H35V207H105V223"/>
    <path d="M570 64H825V207H755V223"/>
    <path d="M570 48H584V204H482V223"/>
    <path d="M600 264H545"/>
    <path d="M315 264H260"/>
    <path d="M350 359V333H145V303"/>
    <path d="M430 359V303"/>
    <path d="M510 359V333H715V303"/>
  </g>
  <g stroke="#718fa7" stroke-width="1.5" fill="#fff">
    <rect x="290" y="25" width="280" height="48" rx="8"/>
    <rect x="290" y="108" width="280" height="48" rx="8"/>
    <rect x="30" y="223" width="230" height="80" rx="8" fill="#e6eff8"/>
    <rect x="315" y="223" width="230" height="80" rx="8" fill="#e6eff8"/>
    <rect x="600" y="223" width="230" height="80" rx="8" fill="#e6eff8"/>
    <rect x="290" y="359" width="280" height="50" rx="8"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#19334c">
    <g font-size="17" font-weight="700">
      <text x="430" y="56">組み立て</text>
      <text x="430" y="139">プレゼンテーション・共通UI</text>
      <text x="145" y="248">参加資格 Core</text>
      <text x="430" y="248">予約 Core</text>
      <text x="715" y="248">来場受付 Core</text>
      <text x="430" y="390">シミュレーター</text>
    </g>
    <g font-size="13">
      <text x="145" y="270">資格の保有・期限</text>
      <text x="430" y="270">資格充足・成立・照会・取消</text>
      <text x="715" y="270">受付時間・参加者単位の成立</text>
      <text x="145" y="288">EligibilityPort</text>
      <text x="430" y="288">ReservationPort</text>
      <text x="715" y="288">CheckInPort</text>
      <text x="430" y="441">矢印は静的なソース依存を示す（参照元 → 依存先）</text>
    </g>
  </g>
</svg>
