<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 0 800 278" role="img" aria-labelledby="title description">
  <title id="title">予約操作の前提・結果・次の操作</title>
  <desc id="description">確認済みの予約内容を受け取った Core が送信する。結果不明の場合は元の要求を照会し、未成立が確定した場合は期限内に再試行できる。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#47647b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; fill: #142638; }
    .title { font-size: 31px; font-weight: 700; }
    .label { font-size: 23px; font-weight: 700; }
    .body { font-size: 19px; }
    .small { font-size: 17px; fill: #475569; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 19px; }
    .blue { fill: #1d4ed8; }
    .teal { fill: #0f766e; }
  </style>
  <rect width="800" height="278" rx="20" fill="#f8fafc"/>
  <text x="40" y="57" class="title" text-anchor="start">予約操作の前提・結果・次の操作</text>
  <rect x="40" y="93" width="220" height="108" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="55" y="126" class="body" text-anchor="start">前提</text>
  <text x="55" y="158" class="small" text-anchor="start">確認済みの予約内容</text>
  <text x="55" y="183" class="small" text-anchor="start">ConfirmedDraft</text>
  <path d="M260 147H285" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="93" width="220" height="108" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="305" y="126" class="body" text-anchor="start">Core が送信</text>
  <text x="305" y="158" class="small" text-anchor="start">予約の結果を判定</text>
  <text x="305" y="183" class="small" text-anchor="start">必要な操作券を返す</text>
  <path d="M510 147H535" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="93" width="220" height="108" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="555" y="126" class="body" text-anchor="start">次の操作</text>
  <text x="555" y="158" class="small" text-anchor="start">不明 → 元の要求を照会</text>
  <text x="555" y="183" class="small" text-anchor="start">未成立 → 期限内に再試行</text>
  <text x="40" y="247" class="small" text-anchor="start">結果と画面の分岐は型でつなぎ、時刻と対象は操作時に照合します。</text>
</svg>
