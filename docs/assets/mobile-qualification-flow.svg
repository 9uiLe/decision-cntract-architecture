<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-labelledby="title description">
  <title id="title">参加資格の確認から予約送信まで</title>
  <desc id="description">参加資格 Core が参加者ごとに資格を照会し、有効・未取得・期限切れ・確認結果不明に分ける。確認結果不明では再照会でき、予約作成は始めない。予約の送信と再試行の直前には全員分を再照会し、一つの時刻で判定する。失効した参加者がいれば要求を送信しない。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#47647b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; fill: #142638; font-size: 18px; }
    .title { font-size: 26px; font-weight: 700; }
    .sec { font-size: 18px; font-weight: 700; fill: #0f766e; }
    .b { font-weight: 700; }
    .s { font-size: 16px; fill: #3d5266; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; }
    .mb { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; }
    .blue { fill: #1d4ed8; }
    .teal { fill: #0f766e; }
  </style>
  <rect width="800" height="610" rx="20" fill="#f8fafc"/>
  <text x="40" y="52" class="title" text-anchor="start">参加資格の確認から予約送信まで</text>
  <text x="40" y="92" class="sec" text-anchor="start">1. 参加者ごとの確認結果</text>
  <rect x="200" y="106" width="400" height="46" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="400.0" y="135.0" text-anchor="middle">参加資格 Core が参加者と必要な資格の組を照会</text>
  <path d="M400 152V170H115V196" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 152V170H305V196" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 152V170H495V196" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 152V170H685V196" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="196" width="170" height="72" rx="10" fill="#e6f6f3" stroke="#4fa396" stroke-width="1.6"/>
  <text x="115.0" y="225.5" class="b" text-anchor="middle">有効</text>
  <text x="115.0" y="250.5" class="m" text-anchor="middle">now &lt; expiresAt</text>
  <rect x="220" y="196" width="170" height="72" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="305.0" y="225.5" class="b" text-anchor="middle">未取得</text>
  <text x="305.0" y="250.5" class="s" text-anchor="middle">資格を保有しない</text>
  <rect x="410" y="196" width="170" height="72" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="495.0" y="225.5" class="b" text-anchor="middle">期限切れ</text>
  <text x="495.0" y="250.5" class="m" text-anchor="middle">expiresAt ≤ now</text>
  <rect x="600" y="196" width="170" height="72" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="685.0" y="225.5" class="b" text-anchor="middle">確認結果不明</text>
  <text x="685.0" y="250.5" class="s" text-anchor="middle">確認できない場合</text>
  <path d="M115 268V298" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="298" width="170" height="72" rx="10" fill="#e6f6f3" stroke="#4fa396" stroke-width="1.6"/>
  <text x="115.0" y="340.0" class="b" text-anchor="middle">資格条件を満たす</text>
  <path d="M305 268V298" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="298" width="170" height="72" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="305.0" y="340.0" class="b" text-anchor="middle">予約へ進めない</text>
  <path d="M495 268V298" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="410" y="298" width="170" height="72" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="495.0" y="340.0" class="b" text-anchor="middle">予約へ進めない</text>
  <path d="M685 268V298" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="298" width="170" height="72" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="685.0" y="327.5" class="b" text-anchor="middle">資格を再照会できる</text>
  <text x="685.0" y="352.5" class="s" text-anchor="middle">予約作成は始めない</text>
  <text x="40" y="412" class="sec" text-anchor="start">2. 予約の送信・再試行の直前</text>
  <rect x="30" y="428" width="190" height="78" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="125.0" y="460.5" class="b" text-anchor="middle">全員分を再照会</text>
  <text x="125.0" y="485.5" class="s" text-anchor="middle">参加資格 Core</text>
  <path d="M220 467H270" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="428" width="200" height="78" rx="10" fill="#e6f6f3" stroke="#4fa396" stroke-width="1.6"/>
  <text x="370.0" y="460.5" class="b" text-anchor="middle">一つの時刻で判定</text>
  <text x="370.0" y="485.5" class="m" text-anchor="middle">now &lt; expiresAt</text>
  <path d="M470 467H500V448H540" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 467H500V486H540" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="428" width="230" height="40" rx="10" fill="#e6f6f3" stroke="#4fa396" stroke-width="1.6"/>
  <text x="655.0" y="454.0" class="b" text-anchor="middle">全員有効・開始前 → 送信</text>
  <rect x="540" y="474" width="230" height="40" rx="10" fill="#ffffff" stroke="#6b7f93" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="655.0" y="500.0" class="b" text-anchor="middle">失効者あり → 送信しない</text>
  <rect x="30" y="540" width="740" height="44" rx="10" fill="#ffffff" stroke="#8aa6bb" stroke-width="1.6"/>
  <text x="400.0" y="568.0" text-anchor="middle">成立済みの予約は、予約後に資格の期限を迎えても維持する</text>
</svg>
