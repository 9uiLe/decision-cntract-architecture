<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title description">
  <title id="title">検証アプリの技術構成</title>
  <desc id="description">OS ごとの入口が共通 UI を起動し、共通 UI が Core を呼び出す。共通 UI は Compose Multiplatform、Core とシミュレーターは Kotlin Multiplatform の共通コードに置く。Gradle、Android Gradle Plugin、XcodeGen、detekt がビルドと検査を受け持つ。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#47647b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; fill: #142638; font-size: 18px; }
    .title { font-size: 26px; font-weight: 700; }
    .sec { font-size: 18px; font-weight: 700; fill: #0f766e; }
    .b { font-weight: 700; }
    .s { font-size: 16px; fill: #3d5266; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; }
    .mb { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; }
    .blue { fill: #1d4ed8; }
    .teal { fill: #0f766e; }
  </style>
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <text x="40" y="52" class="title" text-anchor="start">検証アプリの技術構成</text>
  <rect x="30" y="80" width="440" height="78" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="250.0" y="100.0" class="b" text-anchor="middle">OS ごとの入口</text>
  <text x="250.0" y="125.0" class="s" text-anchor="middle">起動・ライフサイクル・戻る操作</text>
  <text x="250.0" y="150.0" class="s" text-anchor="middle">Android / iOS (XcodeGen 2.44.1)</text>
  <path d="M250 158V182" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="182" width="440" height="78" rx="10" fill="#eff6ff" stroke="#93b5f2" stroke-width="1.6"/>
  <text x="250.0" y="202.0" class="b" text-anchor="middle">共通 UI と画面状態</text>
  <text x="250.0" y="227.0" class="s" text-anchor="middle">Compose Multiplatform 1.12.2</text>
  <text x="250.0" y="252.0" class="s" text-anchor="middle">Material 3 1.9.0</text>
  <path d="M250 260V284" fill="none" stroke="#47647b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="284" width="440" height="78" rx="10" fill="#e6f6f3" stroke="#4fa396" stroke-width="1.6"/>
  <text x="250.0" y="304.0" class="b" text-anchor="middle">Core とシミュレーター</text>
  <text x="250.0" y="329.0" class="s" text-anchor="middle">Kotlin Multiplatform 2.3.21</text>
  <text x="250.0" y="354.0" class="s" text-anchor="middle">資格・予約・来場受付を別モジュールに分離</text>
  <rect x="500" y="80" width="270" height="282" rx="10" fill="#ffffff" stroke="#6b7f93" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="635.0" y="152.0" class="b" text-anchor="middle">ビルドと検査</text>
  <text x="635.0" y="177.0" class="s" text-anchor="middle">Gradle 9.3.1</text>
  <text x="635.0" y="202.0" class="s" text-anchor="middle">Android Gradle Plugin 9.1.1</text>
  <text x="635.0" y="227.0" class="s" text-anchor="middle">detekt 2.0.0-alpha.3</text>
  <text x="635.0" y="277.0" class="s" text-anchor="middle">JVM ターゲットで</text>
  <text x="635.0" y="302.0" class="s" text-anchor="middle">負例・detekt・振る舞いを検証</text>
</svg>
