<path d="M 1253 363 L 1253 391" fill="none" stroke="#47647b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" data-edge="案内:skill:guide&gt;skill:refactor"/>
<path d="M 52 655 L 911 655" fill="none" stroke="#47647b" stroke-width="2" stroke-dasharray="7 5" data-bus="案内:skill:guide"/>
<path d="M 227 655 L 227 675" fill="none" stroke="#47647b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" data-edge="案内:skill:guide&gt;skill:lint"/>
