<text x="40" y="76" font-size="36" fill="#142638">dca Plugin の構成</text>
<text x="40" y="114" font-size="18" fill="#4a6075">Skill 8 件、共通資料、実行環境、成果物の関係。版 0.1.1</text>
<rect x="40" y="140" width="1400" height="755" rx="14" fill="#fbfcfe" stroke="#5b7fb0" stroke-width="3"/>
<text x="64" y="172" font-size="22" fill="#142638">Plugin: dca（Skill 8 件。名前空間 dca:）</text>
<rect x="540" y="188" width="400" height="147" rx="10" fill="#fff4dc" stroke="#c8963c" stroke-width="2" data-node="skill:guide"/>
<text x="556" y="231" font-size="24" fill="#142638">guide</text>
<text x="556" y="256" font-size="13" fill="#4a6075">利用者の明示でも、依頼の内容からでも起動する</text>
<text x="556" y="285" font-size="15" fill="#142638">利用者の目的を一つ選び、使う Skill を一つ案内する。</text>
<text x="556" y="314" font-size="14" fill="#4a6075">参照: 外部記録</text>
<rect x="64" y="391" width="326" height="244" rx="10" fill="#eef5fb" stroke="#7ea0c0" stroke-width="2" data-node="skill:map"/>
<text x="80" y="434" font-size="24" fill="#142638">map</text>
<text x="80" y="459" font-size="13" fill="#4a6075">利用者が明示して起動する</text>
<text x="80" y="488" font-size="15" fill="#142638">対象フローの判断と保証の所在を、根拠付</text>
<text x="80" y="512" font-size="15" fill="#142638">きで対応付ける。</text>
<text x="80" y="541" font-size="14" fill="#4a6075">参照: 情報モデル・外部記録・同梱思想の索引</text>
<text x="80" y="566" font-size="14" fill="#4a6075">引き継ぎ先: interview・scan</text>
<text x="80" y="591" font-size="14" fill="#4a6075">生成: 外部記録</text>
<rect x="406" y="391" width="326" height="244" rx="10" fill="#eef5fb" stroke="#7ea0c0" stroke-width="2" data-node="skill:scan"/>
<text x="422" y="434" font-size="24" fill="#142638">scan</text>
<text x="422" y="459" font-size="13" fill="#4a6075">利用者が明示して起動する</text>
<text x="422" y="488" font-size="15" fill="#142638">対象フローの問題を、根拠付きで種類を分</text>
<text x="422" y="512" font-size="15" fill="#142638">けて報告する。</text>
<text x="422" y="541" font-size="14" fill="#4a6075">参照: 情報モデル・外部記録・検証・同梱思想</text>
<text x="422" y="564" font-size="14" fill="#4a6075">の索引</text>
<text x="422" y="589" font-size="14" fill="#4a6075">引き継ぎ先: interview・lint・refactor</text>
<text x="422" y="614" font-size="14" fill="#4a6075">生成: 外部記録</text>
<rect x="748" y="391" width="326" height="244" rx="10" fill="#eef5fb" stroke="#7ea0c0" stroke-width="2" data-node="skill:interview"/>
<text x="764" y="434" font-size="24" fill="#142638">interview</text>
<text x="764" y="459" font-size="13" fill="#4a6075">利用者が明示して起動する</text>
<text x="764" y="488" font-size="15" fill="#142638">未決の判断を利用者との対話で合意に変え</text>
<text x="764" y="512" font-size="15" fill="#142638">る。</text>
<text x="764" y="541" font-size="14" fill="#4a6075">参照: 情報モデル・段階移行・外部記録・同梱</text>
<text x="764" y="564" font-size="14" fill="#4a6075">思想の索引</text>
<text x="764" y="589" font-size="14" fill="#4a6075">引き継ぎ先: refactor</text>
<text x="764" y="614" font-size="14" fill="#4a6075">生成: 外部記録</text>
<rect x="1090" y="391" width="326" height="244" rx="10" fill="#eef5fb" stroke="#7ea0c0" stroke-width="2" data-node="skill:refactor"/>
<text x="1106" y="434" font-size="24" fill="#142638">refactor</text>
<text x="1106" y="459" font-size="13" fill="#4a6075">利用者が明示して起動する</text>
<text x="1106" y="488" font-size="15" fill="#142638">対象フローの DCA への段階移行を、依頼さ</text>
<text x="1106" y="512" font-size="15" fill="#142638">れた範囲で進める。</text>
<text x="1106" y="541" font-size="14" fill="#4a6075">参照: 情報モデル・段階移行・外部記録・検</text>
<text x="1106" y="564" font-size="14" fill="#4a6075">証・同梱思想の索引</text>
<text x="1106" y="589" font-size="14" fill="#4a6075">引き継ぎ先: interview</text>
<text x="1106" y="614" font-size="14" fill="#4a6075">生成: 外部記録</text>
<rect x="64" y="675" width="326" height="196" rx="10" fill="#eef5fb" stroke="#7ea0c0" stroke-width="2" data-node="skill:lint"/>
<text x="80" y="718" font-size="24" fill="#142638">lint</text>
<text x="80" y="743" font-size="13" fill="#4a6075">利用者が明示して起動する</text>
<text x="80" y="772" font-size="15" fill="#142638">機械で検出できる範囲と、人の判断が要る</text>
<text x="80" y="796" font-size="15" fill="#142638">範囲を分け、検査ルールを提案する。</text>
<text x="80" y="825" font-size="14" fill="#4a6075">参照: 情報モデル・検証・同梱思想の索引</text>
<rect x="406" y="675" width="326" height="196" rx="10" fill="#e8f3ee" stroke="#5f9c82" stroke-width="2" data-node="skill:principles"/>
<text x="422" y="718" font-size="24" fill="#142638">principles</text>
<text x="422" y="743" font-size="13" fill="#4a6075">利用者が明示して起動する</text>
<text x="422" y="772" font-size="15" fill="#142638">同梱する DCA の思想と、その適用条件、必</text>
<text x="422" y="796" font-size="15" fill="#142638">須と任意の区別、共通手順の所在を説明す</text>
<text x="422" y="820" font-size="15" fill="#142638">る。</text>
<text x="422" y="849" font-size="14" fill="#4a6075">参照: 同梱思想の索引</text>
<rect x="748" y="675" width="326" height="196" rx="10" fill="#eef5fb" stroke="#7ea0c0" stroke-width="2" data-node="skill:overview"/>
<text x="764" y="718" font-size="24" fill="#142638">overview</text>
<text x="764" y="743" font-size="13" fill="#4a6075">利用者が明示して起動する</text>
<text x="764" y="772" font-size="15" fill="#142638">dca 自体の構成を、根拠付きの SVG で示</text>
<text x="764" y="796" font-size="15" fill="#142638">す。</text>
<text x="764" y="825" font-size="14" fill="#4a6075">参照: 構成図の入力と view データ</text>
<text x="764" y="850" font-size="14" fill="#4a6075">生成: 構成図の SVG・構成図の view データ</text>
